<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TERMINAL_OS: ECLIPSE</title>
    <style>
        body { background: #0a0f0d; color: #39ff14; font-family: monospace; padding: 20px; user-select: none; }
        #terminal { max-width: 700px; margin: 0 auto; background: #050806; border: 2px solid #39ff14; padding: 20px; box-shadow: 0 0 15px rgba(57,255,20,0.2); }
        .bar-container { background: #1a231e; border: 1px solid #39ff14; height: 20px; margin: 10px 0; position: relative; }
        .bar { background: #39ff14; height: 100%; width: 100%; transition: width 0.1s linear; }
        .danger { background: #ff3333 !important; }
        button { background: #111; color: #39ff14; border: 1px solid #39ff14; padding: 8px 16px; cursor: pointer; font-family: monospace; font-size: 14px; margin: 5px 2px; }
        button:hover:not(:disabled) { background: #39ff14; color: #000; }
        button:disabled { border-color: #224422; color: #224422; cursor: not-allowed; }
        #log { height: 120px; overflow-y: auto; border: 1px solid #1a231e; padding: 8px; background: #020403; font-size: 13px; margin: 15px 0; color: #88ee88; }
        #alert-zone { background: #220000; border: 1px dashed #ff3333; padding: 10px; margin: 15px 0; display: none; color: #ff3333; }
        input[type="text"] { background: #000; border: 1px solid #ff3333; color: #ff3333; padding: 5px; font-family: monospace; width: 150px; }
    </style>
</head>
<body>
<div id="terminal">
    <h2>[SYS_RECOVERY_V2.0.6]</h2>
    <p>Target: <b>10,000 Terabytes</b> for deep-space broadcast extraction.</p>
    
    <div>DATA EXTRACTED: <span id="data-display" style="font-weight:bold; font-size:18px;">0</span> / 10,000 TB</div>
    <div>ACTIVE BOTS: <span id="bots-display">0</span> (Extracting <span id="bps-display">0</span> TB/s)</div>
    
    <div style="margin-top: 15px;">GRID ENERGY:</div>
    <div class="bar-container"><div id="energy-bar" class="bar"></div></div>
    <div>Drain Rate: <span id="drain-display">2.0</span> MW/s</div>

    <div style="margin: 20px 0;">
        <button id="btn-defrag" onclick="manualDefrag()">[ MANUAL DEFRAG (+10 TB) ]</button>
        <button id="btn-bot" onclick="buyBot()">[ BUILD SCRAPER BOT (Cost: 100 TB) ]</button>
        <button id="btn-power" onclick="routePower()">[ ROUTE AUX POWER (+30% Energy) ]</button>
    </div>

    <div id="alert-zone">
        <b id="alert-title">CRITICAL ERROR</b><br>
        <span id="alert-desc"></span><br><br>
        <div id="alert-action"></div>
    </div>

    <div id="log"></div>
</div>

<script>
    let state = { data: 0, bots: 0, energy: 100, target: 10,000, activeEvent: null, eventTimer: 0, totalTicks: 0 };
    const logEl = document.getElementById('log');

    function log(msg, color = '#88ee88') {
        logEl.innerHTML += `<div style="color: ${color}">> ${msg}</div>`;
        logEl.scrollTop = logEl.scrollHeight;
    }

    function manualDefrag() {
        if (state.activeEvent === 'LOCKOUT') return log("ERROR: Keyboard system locked by anomaly!", "#ff3333");
        state.data += 10;
        if (state.activeEvent === 'GLITCH' && Math.random() < 0.4) {
            state.data = Math.max(0, state.data - 25);
            log("Glitch flipped your bits! Lost 25 TB!", "#ff3333");
        } else {
            log("Manual sectors aligned. Gathered 10 TB.");
        }
        updateUI();
    }

    function buyBot() {
        let cost = 100 + Math.floor(state.bots * 45);
        if (state.data >= cost) {
            state.data -= cost;
            state.bots++;
            log(`Scraper Bot #${state.bots} deployed online.`, "#39ff14");
            updateUI();
        }
    }

    function routePower() {
        if (state.activeEvent === 'OVERLOAD') return log("ERROR: Breakers fried. Cannot route power!", "#ff3333");
        state.energy = Math.min(100, state.energy + 30);
        log("Auxiliary capacitors discharged into the main frame.", "#39ff14");
        updateUI();
    }

    const EVENTS = [
        {
            id: 'OVERLOAD',
            title: '⚡ GRID OVERLOAD DETECTED',
            desc: 'The power routing grid is melted shut. Click the bypass valve repeatedly to release pressure!',
            start: () => { state.eventTimer = 12; },
            render: () => `<button onclick="resolveEvent('OVERLOAD')">PUMP BYPASS VALVE</button> (Required: 8 clicks)`,
            work: () => { 
                state.eventTimer--; 
                if (!state.eventWork) state.eventWork = 0;
                state.eventWork++;
                if (state.eventWork >= 8) endEvent("Grid cleared. Power routing systems operational.");
            }
        },
        {
            id: 'GLITCH',
            title: '👾 MATRIX GLITCH IN PROGRESS',
            desc: 'Corrupted data cycles are active. Manual defrags might delete data instead! Type the flush code:',
            start: () => { 
                state.eventTimer = 15; 
                state.eventWork = Math.floor(1000 + Math.random() * 9000).toString(16).toUpperCase();
            },
            render: () => `Type <b>${state.eventWork}</b>: <input type="text" id="ev-input" oninput="checkGlitchCode(this.value)">`,
            work: () => {}
        },
        {
            id: 'LOCKOUT',
            title: '🔒 SECURITY COLD-LOCK',
            desc: 'Main terminal buttons are locked out. Cut the primary processing wire by typing exactly "CUT WIRE"',
            start: () => { state.eventTimer = 15; },
            render: () => `<input type="text" id="ev-input" placeholder="Type command..." oninput="if(this.value.toUpperCase()==='CUT WIRE') endEvent('Lockout bypassed!');">`,
            work: () => {}
        }
    ];

    function checkGlitchCode(val) {
        if (val.toUpperCase() === state.eventWork) endEvent("Cache cleared. Matrix stabilized.");
    }

    function resolveEvent(id) {
        let ev = EVENTS.find(e => e.id === id);
        if (ev) ev.work();
    }

    function triggerRandomEvent() {
        if (state.activeEvent) return;
        let ev = EVENTS[Math.floor(Math.random() * EVENTS.length)];
        state.activeEvent = ev.id;
        state.eventWork = null;
        ev.start();
        document.getElementById('alert-zone').style.display = 'block';
        document.getElementById('alert-title').innerText = ev.title;
        document.getElementById('alert-desc').innerText = ev.desc;
        document.getElementById('alert-action').innerHTML = ev.render();
        log(`WARNING: Emergency event initiated: ${ev.title}`, "#ff3333");
    }

    function endEvent(msg) {
        state.activeEvent = null;
        document.getElementById('alert-zone').style.display = 'none';
        log(msg, "#39ff14");
        updateUI();
    }

    function updateUI() {
        document.getElementById('data-display').innerText = state.data.toLocaleString();
        let botCost = 100 + Math.floor(state.bots * 45);
        document.getElementById('btn-bot').innerText = `[ BUILD SCRAPER BOT (Cost: ${botCost} TB) ]`;
        document.getElementById('btn-bot').disabled = state.data < botCost;
        document.getElementById('bots-display').innerText = state.bots;
        document.getElementById('bps-display').innerText = state.bots * 4;
        
        let eBar = document.getElementById('energy-bar');
        eBar.style.width = `${state.energy}%`;
        if (state.energy < 30) eBar.classList.add('danger');
        else eBar.classList.remove('danger');
        
        let baseDrain = 2.0;
        let scalingDrain = baseDrain + (state.bots * 0.8) + (state.totalTicks * 0.015);
        document.getElementById('drain-display').innerText = scalingDrain.toFixed(2);
    }

    // Main Game loop running at 1-second intervals
    const loop = setInterval(() => {
        state.totalTicks++;
        
        // Dynamic scaling difficulty
        let baseDrain = 2.0;
        let scalingDrain = baseDrain + (state.bots * 0.8) + (state.totalTicks * 0.015);
        
        // Passive gathering and energy depletion
        state.data += state.bots * 4;
        state.energy -= scalingDrain;

        // Process active event countdowns
        if (state.activeEvent) {
            state.eventTimer--;
            let alertDesc = EVENTS.find(e => e.id === state.activeEvent).desc;
            document.getElementById('alert-desc').innerText = `${alertDesc} (TIME REMAINING: ${state.eventTimer}s)`;
            
            if (state.eventTimer <= 0) {
                state.energy -= 40;
                endEvent("CRITICAL FAILURE: Event timer expired! Massive grid damage sustained (-40% Energy).");
            }
        } else if (state.totalTicks > 5 && Math.random() < 0.12) {
            triggerRandomEvent();
        }

        // Win / Loss conditions
        if (state.energy <= 0) {
            state.energy = 0;
            updateUI();
            log("CRITICAL: GRID POWER ZERO. SYSTEM SHUTTING DOWN permanently.", "#ff3333");
            alert("SYSTEM COLLAPSE: The terminal ran out of juice. Your transmissions fade out into the dark universe. GAME OVER.");
            clearInterval(loop);
        } else if (state.data >= 10000) {
            updateUI();
            log("SUCCESS: 10,000 TB EXTRACTED. Broadcast sequence activated!", "#39ff14");
            alert("VICTORY! Against compounding grid rot and endless system alerts, you completely defragged the core sectors and beamed the emergency message home!");
            clearInterval(loop);
        } else {
            updateUI();
        }
    }, 1000);

    log("Terminal initialized. Core connection established. Begin data harvest.");
    updateUI();
</script>
</body>
</html>
