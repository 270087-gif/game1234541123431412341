<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORBITAL RUSH</title>
    <style>
        body { margin: 0; background: #0a0a12; color: #fff; font-family: system-ui, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; user-select: none; }
        canvas { background: #111122; box-shadow: 0 0 30px rgba(0,255,200,0.2); border-radius: 12px; max-width: 100vw; max-height: 100vh; }
        #ui { position: absolute; text-align: center; pointer-events: none; }
        h1 { font-size: 2.5rem; margin: 0; letter-spacing: 4px; color: #00ffcc; text-shadow: 0 0 10px rgba(0,255,200,0.5); }
        p { margin: 5px 0; color: #888; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div id="ui">
        <h1 id="score">0</h1>
        <p id="hint">CLICK / TAP to switch orbits & dodge</p>
    </div>
    <canvas id="game" width="500" height="500"></canvas>
    <script>
        const canvas = document.getElementById('game'), ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score'), hintEl = document.getElementById('hint');
        
        let score = 0, high = localStorage.getItem('hi') || 0, over = false;
        let pRadius = 60, pAngle = 0, pTargetRadius = 60;
        let speed = 0.04, spawnChance = 0.02, particles = [], enemies = [];
        const orbits = [60, 110, 160];

        function reset() {
            score = 0; over = false; speed = 0.04; spawnChance = 0.02;
            enemies = []; particles = []; pRadius = pTargetRadius = orbits[0];
            scoreEl.innerText = "0"; hintEl.innerText = "CLICK / TAP to switch orbits";
        }

        window.addEventListener('pointerdown', () => {
            if (over) return reset();
            let idx = orbits.indexOf(pTargetRadius);
            pTargetRadius = orbits[(idx + 1) % orbits.length];
            for(let i=0; i<5; i++) spawnPart(pRadius * Math.cos(pAngle) + 250, pRadius * Math.sin(pAngle) + 250, '#00ffcc');
        });

        function spawnPart(x, y, color) {
            particles.push({x, y, vx: (Math.random()-0.5)*4, vy: (Math.random()-0.5)*4, alpha: 1, color});
        }

        function loop() {
            ctx.fillStyle = 'rgba(17, 17, 34, 0.3)'; ctx.fillRect(0, 0, 500, 500);
            
            // Draw Orbits
            orbits.forEach(r => {
                ctx.beginPath(); ctx.arc(250, 250, r, 0, Math.PI*2);
                ctx.strokeStyle = 'rgba(255,255,255,0.05)'; ctx.lineWidth = 2; ctx.stroke();
            });

            if (!over) {
                pAngle += speed;
                pRadius += (pTargetRadius - pRadius) * 0.2;
                score += 0.02; scoreEl.innerText = Math.floor(score);
                speed += 0.00002; spawnChance = Math.min(0.06, spawnChance + 0.00001);

                if (Math.random() < spawnChance) {
                    enemies.push({
                        orbit: orbits[Math.floor(Math.random() * orbits.length)],
                        angle: pAngle + Math.PI + (Math.random() - 0.5),
                        size: 8 + Math.random() * 6,
                        speed: (0.01 + Math.random() * 0.02) * (Math.random() > 0.5 ? 1 : -1)
                    });
                }
            } else {
                ctx.fillStyle = 'rgba(255, 0, 85, 0.1)'; ctx.fillRect(0,0,500,500);
            }

            // Update & Draw Player
            let px = 250 + pRadius * Math.cos(pAngle), py = 250 + pRadius * Math.sin(pAngle);
            if (!over) {
                ctx.shadowBlur = 15; ctx.shadowColor = '#00ffcc';
                ctx.fillStyle = '#00ffcc'; ctx.beginPath(); ctx.arc(px, py, 8, 0, Math.PI*2); ctx.fill();
                ctx.shadowBlur = 0;
            }

            // Enemies
            enemies.forEach((e, idx) => {
                e.angle += e.speed;
                let ex = 250 + e.orbit * Math.cos(e.angle), ey = 250 + e.orbit * Math.sin(e.angle);
                
                ctx.fillStyle = '#ff0055'; ctx.shadowColor = '#ff0055'; ctx.shadowBlur = 10;
                ctx.beginPath(); ctx.arc(ex, ey, e.size, 0, Math.PI*2); ctx.fill(); ctx.shadowBlur = 0;

                // Collision Detection
                if (!over && Math.hypot(px - ex, py - ey) < (8 + e.size)) {
                    over = true; if(score > high) localStorage.setItem('hi', Math.floor(score));
                    for(let i=0; i<30; i++) spawnPart(px, py, '#ff0055');
                    hintEl.innerHTML = `GAME OVER<br>Best: ${Math.floor(localStorage.getItem('hi'))}<br>Click to Restart`;
                }
            });

            // Particles
            particles.forEach((p, idx) => {
                p.x += p.vx; p.y += p.vy; p.alpha -= 0.02;
                if (p.alpha <= 0) particles.splice(idx, 1);
                ctx.fillStyle = p.color; ctx.globalAlpha = p.alpha;
                ctx.fillRect(p.x, p.y, 3, 3); ctx.globalAlpha = 1;
            });

            requestAnimationFrame(loop);
        }
        loop();
    </script>
</body>
</html>
