<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TERMINAL OVERLOAD</title>
    <style>
        body { background: #0a0e14; color: #00ff66; font-family: 'Courier New', monospace; padding: 20px; max-width: 650px; margin: auto; user-select: none; }
        .panel { border: 2px solid #00ff66; padding: 15px; margin-bottom: 15px; box-shadow: 0 0 10px rgba(0,255,102,0.2); }
        .danger { border-color: #ff3333; color: #ff3333; animation: blink 1s infinite; }
        button { background: #002208; color: #00ff66; border: 1px solid #00ff66; padding: 8px 15px; cursor: pointer; font-family: inherit; font-weight: bold; margin: 5px 0; width: 100%; text-transform: uppercase; }
        button:hover { background: #00ff66; color: #002208; }
        button:disabled { border-color: #555; color: #555; background: transparent; cursor: not-allowed; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        #log { height: 120px; overflow-y: auto; font-size: 13px; border: 1px solid #00ff66; padding: 8px; background: #020602; white-space: pre-line; }
        @keyframes blink { 50% { border-color: transparent; } }
        .progress-bar { background: #111; border: 1px solid #00ff66; height: 12px; margin-top: 5px; }
        .progress-fill { background: #00ff66; height: 100%; width: 100%; transition: width 0.1s linear; }
        .danger .progress-fill { background: #ff3333; }
        input[type="text"] { background: #000; color: #ff3333; border: 1px solid #ff3333; width: 95%; padding: 6px; font-family: inherit; margin-top: 5px; }
    </style>
</head>
<body>
    <div class="panel">
        <h2 style="margin:0 0 10px 0; text-align:center;">=== DEEP SPACE TERMINAL: OS v9.42 ===</h2>
        <div style="font-size:12px; text-align:center; margin-bottom:10px;" id="story-node">Initializing Subsystems... Route backup grids. Reach 100,000 Data Units.</div>
        <div class="grid">
            <div>DATA UNITS: <strong id="data-val">0</strong> / 100,000</div>
            <div>GRID STABILITY: <strong id="power-val">100</strong>%</div>
        </div>
        <div class="progress-bar"><div id="power-bar" class="progress-fill"></div></div>
    </div>

    <div class="panel danger" id="evt-panel" style="display:none;">
        <div style="font-weight:bold; margin-bottom:5px;">⚠️ CRITICAL SYSTEM ANOMALY: <span id="evt-title">NONE</span></div>
        <div id="evt-desc" style="font-size:13px; margin-bottom:8px;"></div>
        <div id="evt-interact"></div>
    </div>

    <div class="grid">
        <div class="panel">
            <button id="btn-manual" onclick="manualDefrag()">Execute Manual Defrag</button>
            <button id="btn-route" onclick="routePower()">Route Emergency Power</button>
        </div>
        <div class="panel">
            <button id="btn-bot" onclick="buyBot()">Deploy Scraper Bot (<span id="bot-cost">50</span> DT)</button>
            <div style="font-size:12px; margin-top:5px; text-align:center;">Bots Active: <span id="bot-count">0</span> (+<span id="bot-rate">0</span> DT/s, -<span id="bot-drain">0</span>% Stab/s)</div>
        </div>
    </div>

    <div class="panel">
        <div style="font-size:11px; font-weight:bold; margin-bottom:4px;">OS SYSTEM LOG:</div>
        <div id="log"></div>
    </div>

<script>
    let state = { data: 0, power: 100, bots: 0, botCost: 50, elapsed: 0, winTarget: 100000, eventActive: false, currentEvt: null, baseDrain: 0.8 };
    const logEl = document.getElementById("log"), evtPanel = document.getElementById("evt-panel"), evtInteract = document.getElementById("evt-interact");

    function log(msg) { logEl.innerHTML += `> ${msg}\n`; logEl.scrollTop = logEl.scrollHeight; }
    
    function updateUI() {
        document.getElementById("data-val").innerText = Math.floor(state.data).toLocaleString();
        document.getElementById("power-val").innerText = Math.max(0, Math.floor(state.power));
        document.getElementById("power-bar").style.width = `${Math.max(0, state.power)}%`;
        document.getElementById("bot-count").innerText = state.bots;
        document.getElementById("bot-cost").innerText = state.botCost;
        document.getElementById("bot-rate").innerText = (state.bots * 4).toFixed(1);
        document.getElementById("bot-drain").innerText = (state.bots * 0.5).toFixed(1);
        document.getElementById("btn-bot").disabled = state.data < state.botCost || state.eventActive;
        document.getElementById("btn-manual").disabled = state.eventActive && state.currentEvt !== 'OVERHEAT';
        
        let node = "Isolating signal... Avoid total system blackouts.";
        if (state.data > 80000) node = "CORE CRITICAL: Signals collapsing! Hold the power grid together!!";
        else if (state.data > 50000) node = "Deep space terminal feedback looping. Intrusion vectors spiking.";
        else if (state.data > 20000) node = "External relay unlocked. The entity notices your scrapers.";
        else if (state.data > 5000) node = "Data patterns hardening. Automation overhead increasing.";
        document.getElementById("story-node").innerText = node;
    }

    function manualDefrag() {
        if (state.eventActive && state.currentEvt === 'OVERHEAT') {
            state.evtProgress = (state.evtProgress || 0) + 8;
            log(`Cooling flush deployed... ${state.evtProgress}%`);
            if (state.evtProgress >= 100) resolveEvent("Core heat stabilized.");
            return;
        }
        state.data += 15;
        state.power = Math.max(0, state.power - 1.2);
        log("Manual defrag executed. +15 Data. -1.2% Grid Stability.");
        updateUI();
    }

    function routePower() {
        if (state.eventActive) return log("Error: Primary routing matrices locked by active event.");
        if (state.data < 40) return log("Insufficient data packets to re-align grid coordinates.");
        state.data -= 40;
        state.power = Math.min(100, state.power + 25);
        log("Emergency backup power routed. -40 Data. +25% Grid Stability.");
        updateUI();
    }

    function buyBot() {
        if (state.data >= state.botCost) {
            state.data -= state.botCost;
            state.bots++;
            state.botCost = Math.floor(state.botCost * 1.55);
            log(`Scraper Bot deployed. Autonomous harvesting array expanded.`);
            updateUI();
        }
    }

    const events = [
        { id: 'OVERHEAT', title: 'CORE OVERHEAT', desc: 'Manual Defrag cooling blocks jammed! Rapidly SPAM the "Execute Manual Defrag" button to vent heat before meltdown.', init: () => { state.evtProgress = 0; evtInteract.innerHTML = ''; } },
        { id: 'CORRUPT', title: 'LOGIC CORRUPTION', desc: 'A malformed payload has frozen automation! Type the decryption key exactly into the matrix override field below.', init: () => {
            let key = Math.random().toString(36).substring(2,7).toUpperCase();
            evtInteract.innerHTML = `<input type="text" id="evt-input" placeholder="Type Key: ${key}">`;
            document.getElementById("evt-input").oninput = (e) => { if(e.target.value.toUpperCase() === key) resolveEvent("Logic tables purged."); };
        }},
        { id: 'DRAIN', title: 'RESONANCE LEACH', desc: 'An extra-dimensional parasite is eating the terminal grid. Click the discharge node fast to shock it away.', init: () => {
            evtInteract.innerHTML = `<button id="evt-shock-btn" style="border-color:#ff3333; color:#ff3333;">[ INITIALIZE HIGH-VOLTAGE DISCHARGE ]</button>`;
            document.getElementById("evt-shock-btn").onclick = () => resolveEvent("Parasite vaporized.");
        }}
    ];

    function triggerRandomEvent() {
        if (state.eventActive || state.elapsed < 15) return;
        state.eventActive = true;
        let roll = events[Math.floor(Math.random() * events.length)];
        state.currentEvt = roll.id;
        evtPanel.style.display = "block";
        document.getElementById("evt-title").innerText = roll.title;
        document.getElementById("evt-desc").innerText = roll.desc;
        roll.init();
        log(`CRITICAL WARNING: ${roll.title} registered.`);
    }

    function resolveEvent(msg) {
        state.eventActive = false;
        state.currentEvt = null;
        evtPanel.style.display = "none";
        evtInteract.innerHTML = '';
        log(`SUCCESS: ${msg}`);
        updateUI();
    }

    let gameLoop = setInterval(() => {
        state.elapsed += 0.1;
        
        // Progression scaling mechanics
        let scalingFactor = 1 + (state.elapsed / 90); 
        let currentDrain = (state.baseDrain * scalingFactor) + (state.bots * 0.5);
        if (state.currentEvt === 'OVERHEAT') currentDrain += 4.5;
        if (state.currentEvt === 'DRAIN') currentDrain += 3.0;

        state.power -= currentDrain * 0.1;
        
        let passiveIncome = state.bots * 4;
        if (state.currentEvt === 'CORRUPT') passiveIncome = 0;
        state.data += passiveIncome * 0.1;

        if (Math.random() < 0.015) triggerRandomEvent();

        if (state.power <= 0) {
            clearInterval(gameLoop);
            alert(`[SYSTEM CRASH] The terminal lost total grid stability at ${Math.floor(state.data)} data units. Darkness consumes the terminal. GAME OVER.`);
            location.reload();
        }

        if (state.data >= state.winTarget) {
            clearInterval(gameLoop);
            alert(`[CONNECTION SECURED] Total logs uploaded. You successfully broadcast the signal out of the dead sector! YOU WON IN ${(state.elapsed).toFixed(1)}s!`);
            location.reload();
        }

        updateUI();
    }, 100);

    log("Terminal initialized. Ready for operations.");
    updateUI();
</script>
</body>
</html>
