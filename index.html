<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sub-Sector 7: Terminal</title>
    <style>
        body { background: #0b0d10; color: #a3b8cc; font-family: monospace; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        #terminal { width: 620px; background: #12161c; border: 1px solid #2a3644; border-radius: 6px; padding: 25px; box-shadow: 0 15px 35px rgba(0,0,0,0.6); }
        h1 { color: #4fc3f7; margin: 0 0 15px 0; font-size: 1.3rem; letter-spacing: 2px; text-transform: uppercase; border-bottom: 1px solid #2a3644; padding-bottom: 10px; }
        #log { height: 240px; overflow-y: auto; margin-bottom: 20px; padding: 12px; background: #07090c; border-radius: 4px; font-size: 0.9rem; line-height: 1.6; border: 1px solid #1a222a; }
        .msg { margin-bottom: 10px; opacity: 0; animation: fadeIn 0.4s forwards; }
        .sys { color: #64e572; } .story { color: #e0e0e0; } .warn { color: #ff5252; } .intel { color: #b388ff; }
        #stats { display: flex; justify-content: space-between; background: #1a2129; padding: 12px 16px; border-radius: 4px; margin-bottom: 20px; border: 1px solid #25313e; font-size: 0.9rem; }
        .val { color: #ffffff; font-weight: bold; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        button { background: #1f2731; border: 1px solid #3b4e66; color: #e0e0e0; padding: 14px; font-family: monospace; font-size: 0.85rem; cursor: pointer; border-radius: 4px; transition: all 0.25s; text-align: left; }
        button:hover:not(:disabled) { background: #2a3644; border-color: #4fc3f7; color: #fff; box-shadow: 0 0 8px rgba(79,195,247,0.2); }
        button:disabled { opacity: 0.25; cursor: not-allowed; border-color: #222a33; }
        @keyframes fadeIn { to { opacity: 1; } }
    </style>
</head>
<body>
<div id="terminal">
    <h1>Sub-Sector 7 // Core Terminal</h1>
    <div id="stats">
        <div>GRID POWER: <span id="power" class="val">100</span>%</div>
        <div>DATA ARCHIVED: <span id="data" class="val">0</span> / 100 TB</div>
        <div>SCRAPER BOTS: <span id="bots" class="val">0</span></div>
    </div>
    <div id="log"></div>
    <div class="grid">
        <button id="btn-scan" onclick="manualScan()">[F1] Run Manual Defrag</button>
        <button id="btn-bot" onclick="compileBot()" disabled>[F2] Compile Background Scraper (Cost: 15 TB)</button>
        <button id="btn-power" onclick="divertPower()" disabled>[F3] Route Emergency Cells</button>
        <button id="btn-transmit" onclick="transmitPayload()" disabled>[F4] Transmit Final Broadcast</button>
    </div>
</div>
<script>
    let game = { power: 100, data: 0, bots: 0, phase: 0, active: true };
    const logBox = document.getElementById('log');
    
    const narrative = [
        "System initiated. Deep space monitoring platform is dark. Local beacon integrity: Critical.",
        "Sensing pulse anomaly. A massive structural void is slowly drifting past your radar array.",
        "The anomaly changed vectors. It detected the terminal's data signature. Accelerate recovery.",
        "Internal heat exchangers failing due to external radiation pressure. The core is venting.",
        "Archive compilation complete. Sub-Sector 7 history locked down. Long-range array fully primed."
    ];

    function printLog(text, style = 'story') {
        const line = document.createElement('div');
        line.className = `msg ${style}`;
        line.innerText = `> ${text}`;
        logBox.appendChild(line);
        logBox.scrollTop = logBox.scrollHeight;
    }

    function refreshUI() {
        document.getElementById('power').innerText = Math.max(0, Math.floor(game.power));
        document.getElementById('data').innerText = Math.min(100, Math.floor(game.data));
        document.getElementById('bots').innerText = game.bots;
        
        document.getElementById('btn-scan').disabled = !game.active || game.phase >= 4;
        document.getElementById('btn-bot').disabled = !game.active || game.data < 15 || game.phase >= 4;
        document.getElementById('btn-power').disabled = !game.active || game.power >= 40 || game.phase >= 4;
        document.getElementById('btn-transmit').disabled = !game.active || game.data < 100 || game.phase !== 4;
    }

    function manualScan() {
        if (!game.active) return;
        if (game.power <= 4) {
            printLog("Action denied: Insufficient voltage to cycle main sensor bus.", "warn");
            return;
        }
        game.data = Math.min(100, game.data + 2.5);
        game.power -= 4;
        printLog("Local sector swept. +2.5 TB recovered.", "sys");
        evaluateProgress();
        refreshUI();
    }

    function compileBot() {
        if (game.data >= 15) {
            game.data -= 15;
            game.bots++;
            printLog("Automated daemon compiled. Background scraping sequence initialized.", "sys");
            refreshUI();
        }
    }

    function divertPower() {
        if (game.power >= 40) return;
        game.power = Math.min(100, game.power + 30);
        printLog("Auxiliary capacitors flushed. Main grid replenished (+30% Power).", "intel");
        refreshUI();
    }

    function evaluateProgress() {
        let oldPhase = game.phase;
        if (game.data >= 100) game.phase = 4;
        else if (game.data >= 70) game.phase = 3;
        else if (game.data >= 40) game.phase = 2;
        else if (game.data >= 15) game.phase = 1;

        if (game.phase !== oldPhase) {
            printLog(narrative[game.phase], 'intel');
        }
    }

    function transmitPayload() {
        game.active = false;
        document.querySelector('.grid').innerHTML = "<div style='grid-column: span 2; text-align: center; color: #64e572; font-weight: bold; padding: 10px;'>TRANSMISSION SUCCESSFUL. DATA IMMORTALIZED. LOGGING OFF...</div>";
        printLog("Uploading entire sub-sector history directly to the deep-space core... Connection safely severed.", "sys");
        refreshUI();
    }

    setInterval(() => {
        if (!game.active || game.phase === 4) return;
        
        // Passive power drain scales up with more automated background scrapers running
        let passiveDrain = 0.5 + (game.bots * 0.2);
        game.power -= passiveDrain;
        
        if (game.bots > 0) {
            game.data = Math.min(100, game.data + (game.bots * 0.4));
            evaluateProgress();
        }
        
        if (game.power <= 0) {
            game.power = 0;
            game.active = false;
            document.querySelector('.grid').innerHTML = "<div style='grid-column: span 2; text-align: center; color: #ff5252; font-weight: bold; padding: 10px;'>TERMINAL TERMINATED - LIFE SUPPORT FAILURE</div>";
            printLog("Total life support, logic buffers, and memory vaults collapsed. You are lost to the black.", "warn");
        }
        refreshUI();
    }, 1000);

    printLog(narrative[0], 'story');
    refreshUI();
</script>
</body>
</html>
