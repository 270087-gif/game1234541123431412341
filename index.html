<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Fluid Sandbox</title>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; background: #080810; font-family: monospace; }
        canvas { display: block; cursor: crosshair; }
        #ui { position: absolute; top: 15px; left: 15px; color: #7f9fbf; pointer-events: none; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
        h1 { margin: 0 0 5px 0; font-size: 18px; letter-spacing: 2px; color: #00ffcc; }
        p { margin: 0; font-size: 12px; opacity: 0.8; }
    </style>
</head>
<body>
    <div id="ui">
        <h1>QUANTUM FLUID</h1>
        <p>• Click & Drag to swing particles<br>• Smash them at high speed to fracture<br>• Let them rest together to merge</p>
    </div>
    <canvas id="sandbox"></canvas>

    <script>
        const canvas = document.getElementById('sandbox');
        const ctx = canvas.getContext('2d');
        
        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;
        window.addEventListener('resize', () => { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; });

        const particles = [];
        const FRICTION = 0.98; // Creates the liquid-type feeling
        const DENSITY = 0.4;   // Mass relative to area
        let grabbedParticle = null;
        let mouse = { x: 0, y: 0, vx: 0, vy: 0, lastX: 0, lastY: 0 };

        class Particle {
            constructor(x, y, radius, color = null) {
                this.x = x;
                this.y = y;
                this.radius = Math.max(4, radius);
                this.mass = this.radius * DENSITY;
                this.vx = (Math.random() - 0.5) * 4;
                this.vy = (Math.random() - 0.5) * 4;
                this.color = color || `hsl(${Math.random() * 60 + 170}, 100%, 60%)`;
            }

            update() {
                if (this === grabbedParticle) {
                    // Smooth tracking to mouse position
                    this.vx = (mouse.x - this.x) * 0.3;
                    this.vy = (mouse.y - this.y) * 0.3;
                } else {
                    this.vx *= FRICTION;
                    this.vy *= FRICTION;
                    // Gentle liquid float up/down behavior
                    this.vy += Math.sin(this.x * 0.01 + Date.now() * 0.002) * 0.05;
                }
                
                this.x += this.vx;
                this.y += this.vy;

                // Wall bounds with bounce
                if (this.x < this.radius) { this.x = this.radius; this.vx *= -0.6; }
                if (this.x > width - this.radius) { this.x = width - this.radius; this.vx *= -0.6; }
                if (this.y < this.radius) { this.y = this.radius; this.vy *= -0.6; }
                if (this.y > height - this.radius) { this.y = height - this.radius; this.vy *= -0.6; }
            }

            draw() {
                ctx.beginPath();
                let gradient = ctx.createRadialGradient(this.x, this.y, this.radius * 0.1, this.x, this.y, this.radius);
                gradient.addColorStop(0, '#ffffff');
                gradient.addColorStop(0.2, this.color);
                gradient.addColorStop(1, 'transparent');
                ctx.fillStyle = gradient;
                ctx.arc(this.x, this.y, this.radius * 1.4, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // Spawn initial pool of particles
        for (let i = 0; i < 35; i++) {
            particles.push(new Particle(Math.random() * width, Math.random() * height, Math.random() * 25 + 15));
        }

        function handleCollisions() {
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    let p1 = particles[i];
                    let p2 = particles[j];

                    let dx = p2.x - p1.x;
                    let dy = p2.y - p1.y;
                    let dist = Math.sqrt(dx * dx + dy * dy);
                    let minDist = p1.radius + p2.radius;

                    if (dist < minDist) {
                        let overlap = minDist - dist;
                        let nx = dx / dist;
                        let ny = dy / dist;

                        // Separate overlapping particles
                        p1.x -= nx * overlap * 0.5;
                        p1.y -= ny * overlap * 0.5;
                        p2.x += nx * overlap * 0.5;
                        p2.y += ny * overlap * 0.5;

                        // Calculate relative velocity
                        let rvx = p2.vx - p1.vx;
                        let rvy = p2.vy - p1.vy;
                        let velAlongNormal = rvx * nx + rvy * ny;

                        // Only resolve if velocities are moving towards each other
                        if (velAlongNormal < 0) {
                            let speed = Math.sqrt(rvx * rvx + rvy * rvy);

                            // FRACTURE CONDITION: High speed impact sparks splitting
                            if (speed > 16 && (p1.radius > 12 || p2.radius > 12)) {
                                fracture(p1, speed);
                                fracture(p2, speed);
                                return;
                            }

                            // MERGE CONDITION: Slow moving, touching particles blend together
                            if (speed < 1.2 && p1 !== grabbedParticle && p2 !== grabbedParticle) {
                                p1.radius = Math.min(70, Math.sqrt(p1.radius * p1.radius + p2.radius * p2.radius));
                                p1.mass = p1.radius * DENSITY;
                                particles.splice(j, 1);
                                j--;
                                continue;
                            }

                            // Elastic bounce mathematics
                            let restitution = 0.7; 
                            let impulseScalar = -(1 + restitution) * velAlongNormal / (1/p1.mass + 1/p2.mass);
                            let ix = impulseScalar * nx;
                            let iy = impulseScalar * ny;

                            p1.vx -= ix / p1.mass;
                            p1.vy -= iy / p1.mass;
                            p2.vx += ix / p2.mass;
                            p2.vy += iy / p2.mass;
                        }
                    }
                }
            }
        }

        function fracture(p, impactSpeed) {
            if (p.radius <= 8) return;
            const idx = particles.indexOf(p);
            if (idx > -1) particles.splice(idx, 1);
            
            let pieces = Math.floor(Math.random() * 2) + 2; 
            let newRadius = p.radius / Math.sqrt(pieces);

            for (let k = 0; k < pieces; k++) {
                let angle = Math.random() * Math.PI * 2;
                let child = new Particle(p.x + Math.cos(angle)*5, p.y + Math.sin(angle)*5, newRadius, p.color);
                child.vx = p.vx + Math.cos(angle) * (impactSpeed * 0.2);
                child.vy = p.vy + Math.sin(angle) * (impactSpeed * 0.2);
                particles.push(child);
            }
        }

        // Interaction Listeners
        window.addEventListener('mousedown', (e) => {
            mouse.x = e.clientX; mouse.y = e.clientY;
            for (let p of particles) {
                let dist = Math.hypot(p.x - mouse.x, p.y - mouse.y);
                if (dist < p.radius + 15) { grabbedParticle = p; break; }
            }
        });

        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX; mouse.y = e.clientY;
        });

        window.addEventListener('mouseup', () => {
            if (grabbedParticle) {
                // Transfer actual mouse swing speed upon release
                grabbedParticle.vx = mouse.vx * 0.8;
                grabbedParticle.vy = mouse.vy * 0.8;
                grabbedParticle = null;
            }
        });

        // Main game loops
        function loop() {
            ctx.fillStyle = 'rgba(8, 8, 16, 0.25)'; // Gives liquid motion blur tails
            ctx.fillRect(0, 0, width, height);

            // Track mouse acceleration for swinging kinetic energy
            mouse.vx = mouse.x - mouse.lastX;
            mouse.vy = mouse.y - mouse.lastY;
            mouse.lastX = mouse.x;
            mouse.lastY = mouse.y;

            handleCollisions();

            for (let p of particles) {
                p.update();
                p.draw();
            }
            requestAnimationFrame(loop);
        }
        loop();
    </script>
</body>
</html>
