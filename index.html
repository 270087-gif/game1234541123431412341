<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Glow Fluid Sandbox</title>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; background: #06060c; font-family: sans-serif; }
        canvas { display: block; width: 100vw; height: 100vh; }
        #ui { position: absolute; top: 15px; left: 15px; color: rgba(255,255,255,0.7); pointer-events: none; font-size: 13px; line-height: 1.6; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
    </style>
</head>
<body>
    <div id="ui">
        <strong style="color: #00ffcc; font-size: 16px;">FLUID SANDBOX</strong><br>
        • <b>Click & Drag</b> to vortex and pull particles<br>
        • <b>Fling / Swing</b> to launch them into each other<br>
        • <b>Smash fast</b> to fracture them into smaller bits<br>
        • <b>Hold together softly</b> to watch them merge back
    </div>
    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;
        
        window.addEventListener('resize', () => { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; });

        let mouse = { x: 0, y: 0, px: 0, py: 0, down: false };
        window.addEventListener('mousemove', e => { mouse.px = mouse.x; mouse.py = mouse.y; mouse.x = e.clientX; mouse.y = e.clientY; });
        window.addEventListener('mousedown', () => mouse.down = true);
        window.addEventListener('mouseup', () => mouse.down = false);

        class Particle {
            constructor(x, y, radius = Math.random() * 14 + 8, color = null) {
                this.x = x; this.y = y; this.vx = (Math.random() - 0.5) * 4; this.vy = (Math.random() - 0.5) * 4;
                this.radius = radius; this.mass = radius * radius;
                this.color = color || `hsl(${Math.random() * 50 + 175}, 100%, 55%)`;
            }
            update() {
                this.vx *= 0.97; this.vy *= 0.97; // Fluid friction / viscosity
                this.vy += 0.04; // Micro-gravity for fluid-like settling
                this.x += this.vx; this.y += this.vy;
                
                // Elastic wall boundaries
                if (this.x < this.radius) { this.x = this.radius; this.vx *= -0.7; }
                if (this.x > width - this.radius) { this.x = width - this.radius; this.vx *= -0.7; }
                if (this.y < this.radius) { this.y = this.radius; this.vy *= -0.7; }
                if (this.y > height - this.radius) { this.y = height - this.radius; this.vy *= -0.7; }
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.shadowBlur = this.radius * 1.5;
                ctx.shadowColor = this.color;
                ctx.fill();
            }
        }

        let particles = Array.from({ length: 55 }, () => new Particle(Math.random() * width, Math.random() * height));

        function loop() {
            ctx.fillStyle = 'rgba(6, 6, 12, 0.25)'; // Motion blur trailing effect
            ctx.shadowBlur = 0;
            ctx.fillRect(0, 0, width, height);

            // Dragging pulls fluid environment
            if (mouse.down) {
                let mvx = mouse.x - mouse.px;
                let mvy = mouse.y - mouse.py;
                particles.forEach(p => {
                    let dx = mouse.x - p.x;
                    let dy = mouse.y - p.y;
                    let dist = Math.sqrt(dx * dx + dy * dy) || 1;
                    if (dist < 280) {
                        let force = (280 - dist) / 280;
                        // Combines pull towards cursor + mouse momentum transfer
                        p.vx += (dx / dist) * force * 0.7 + mvx * force * 0.35;
                        p.vy += (dy / dist) * force * 0.7 + mvy * force * 0.35;
                    }
                });
            }

            // Spatial Physics & Particle Collisions
            for (let i = 0; i < particles.length; i++) {
                let p1 = particles[i];
                p1.update();

                for (let j = i + 1; j < particles.length; j++) {
                    let p2 = particles[j];
                    let dx = p2.x - p1.x;
                    let dy = p2.y - p1.y;
                    let dist = Math.sqrt(dx * dx + dy * dy) || 1;
                    let minDist = p1.radius + p2.radius;

                    // Smooth Merging Window (When pushed together closely and slowly)
                    if (dist < minDist + 12 && mouse.down) {
                        let relSpd = Math.abs(p1.vx - p2.vx) + Math.abs(p1.vy - p2.vy);
                        if (relSpd < 2.5 && p1.radius < 40 && p2.radius < 40) {
                            p1.radius = Math.sqrt(p1.mass + p2.mass);
                            p1.mass = p1.radius * p1.radius;
                            particles.splice(j, 1);
                            j--;
                            continue;
                        }
                    }

                    // Solid Collision Handling
                    if (dist < minDist) {
                        let overlap = minDist - dist;
                        let nx = dx / dist;
                        let ny = dy / dist;

                        // Separate overlapping particles immediately
                        p1.x -= nx * overlap * 0.5; p1.y -= ny * overlap * 0.5;
                        p2.x += nx * overlap * 0.5; p2.y += ny * overlap * 0.5;

                        // Calculate relative velocities along the normal vector
                        let rvx = p2.vx - p1.vx;
                        let rvy = p2.vy - p1.vy;
                        let speed = rvx * nx + rvy * ny;

                        if (speed < 0) {
                            let impulse = (2 * speed) / (p1.mass + p2.mass);
                            p1.vx += impulse * p2.mass * nx; p1.vy += impulse * p2.mass * ny;
                            p2.vx -= impulse * p1.mass * nx; p2.vy -= impulse * p1.mass * ny;

                            // Smash / Fracture Trigger
                            let smashImpact = Math.abs(speed);
                            if (smashImpact > 11 && (p1.radius > 6 || p2.radius > 6)) {
                                if (p1.radius > 6) {
                                    particles.push(new Particle(p1.x + (Math.random() - 0.5) * 8, p1.y + (Math.random() - 0.5) * 8, p1.radius * 0.55, p1.color));
                                    p1.radius *= 0.55; p1.mass = p1.radius * p1.radius;
                                }
                                if (p2.radius > 6) {
                                    particles.push(new Particle(p2.x + (Math.random() - 0.5) * 8, p2.y + (Math.random() - 0.5) * 8, p2.radius * 0.55, p2.color));
                                    p2.radius *= 0.55; p2.mass = p2.radius * p2.radius;
                                }
                            }
                        }
                    }
                }
                p1.draw();
            }
            requestAnimationFrame(loop);
        }
        loop();
    </script>
</body>
</html>
