<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Cosmos: Particle Physics Sandbox</title>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; background: #05050a; font-family: monospace; user-select: none; }
        canvas { display: block; width: 100vw; height: 100vh; }
        #ui { position: absolute; top: 20px; left: 20px; color: #00ffcc; font-size: 18px; pointer-events: none; text-shadow: 0 0 10px #00ffcc; }
        #instructions { position: absolute; bottom: 20px; width: 100%; text-align: center; color: #444477; font-size: 14px; pointer-events: none; }
    </style>
</head>
<body>
    <div id="ui">SCORE: <span id="score">0</span> | MULTIPLIER: x<span id="mult">1</span></div>
    <div id="instructions">CLICK & HOLD TO CREATE GRAVITY WELLS — TRAP PARTICLES FOR MASSIVE CHAIN REACTIONS</div>
    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const multEl = document.getElementById('mult');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;
        
        let particles = [];
        let wells = [];
        let score = 0;
        let multiplier = 1;
        let lastWellTime = 0;

        window.addEventListener('resize', () => { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; });

        class Particle {
            constructor() {
                this.reset();
                this.x = Math.random() * width;
                this.y = Math.random() * height;
            }
            reset() {
                this.x = Math.random() > 0.5 ? 0 : width;
                this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * 4;
                this.vy = (Math.random() - 0.5) * 4;
                this.radius = Math.random() * 2 + 1;
                this.hue = Math.random() * 60 + 180; // Cyan to Purple
                this.alpha = 1;
                this.isCaptured = false;
            }
            update() {
                wells.forEach(well => {
                    const dx = well.x - this.x;
                    const dy = well.y - this.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    
                    if (dist < well.radius) {
                        if (!this.isCaptured) {
                            this.isCaptured = true;
                            score += Math.floor(10 * multiplier);
                            multiplier += 0.1;
                            scoreEl.innerText = score;
                            multEl.innerText = multiplier.toFixed(1);
                            well.pulse = 15;
                        }
                        this.alpha -= 0.05;
                    } else if (dist < well.gravityRange) {
                        // Physics forces: Gravity pull + Orbit swirl force
                        const force = (well.gravityRange - dist) / well.gravityRange * well.strength;
                        this.vx += (dx / dist) * force + (-dy / dist) * (force * 0.5);
                        this.vy += (dy / dist) * force + (dx / dist) * (force * 0.5);
                        this.hue += 1; // Color shifts as it gets pulled
                    }
                });

                this.x += this.vx;
                this.y += this.vy;
                this.vx *= 0.98; // Friction
                this.vy *= 0.98;

                if (this.alpha <= 0 || this.x < -50 || this.x > width + 50 || this.y < -50 || this.y > height + 50) {
                    this.reset();
                }
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = `hsl(${this.hue}, 100%, 70%)`;
                ctx.shadowBlur = 10;
                ctx.shadowColor = `hsl(${this.hue}, 100%, 70%)`;
                ctx.fill();
                ctx.restore();
            }
        }

        // Initialize 600 particles for smooth physics performance
        for (let i = 0; i < 600; i++) particles.push(new Particle());

        window.addEventListener('mousedown', (e) => spawnWell(e.clientX, e.clientY));
        window.addEventListener('touchstart', (e) => spawnWell(e.touches[0].clientX, e.touches[0].clientY));

        function spawnWell(x, y) {
            wells.push({
                x: x, y: y,
                radius: 10,
                gravityRange: 250,
                strength: 0.8,
                life: 180, // Frames alive
                pulse: 0
            });
            lastWellTime = Date.now();
        }

        function loop() {
            // Motion blur effect by drawing semi-transparent background
            ctx.fillStyle = 'rgba(5, 5, 10, 0.2)';
            ctx.fillRect(0, 0, width, height);

            // Update & Draw Gravity Wells
            for (let i = wells.length - 1; i >= 0; i--) {
                let w = wells[i];
                w.life--;
                if (w.pulse > 0) w.pulse *= 0.9;

                // Draw outer gravity ring
                ctx.beginPath();
                ctx.arc(w.x, w.y, w.gravityRange * (1 - w.life/180), 0, Math.PI * 2);
                ctx.strokeStyle = `rgba(255, 0, 100, ${w.life / 360})`;
                ctx.lineWidth = 1;
                ctx.stroke();

                // Draw central vortex singularity
                ctx.beginPath();
                ctx.arc(w.x, w.y, w.radius + w.pulse, 0, Math.PI * 2);
                ctx.fillStyle = '#ff0055';
                ctx.shadowBlur = 30;
                ctx.shadowColor = '#ff0055';
                ctx.fill();

                if (w.life <= 0) wells.splice(i, 1);
            }

            // Update & Draw Particles
            particles.forEach(p => {
                p.update();
                p.draw();
            });

            // Decaying combo system if no action happens
            if (Date.now() - lastWellTime > 2000 && multiplier > 1) {
                multiplier -= 0.05;
                if (multiplier < 1) multiplier = 1;
                multEl.innerText = multiplier.toFixed(1);
            }

            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
