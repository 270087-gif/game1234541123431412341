<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Vortex Sandbox</title>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; background: #050510; font-family: sans-serif; height: 100%; user-select: none; }
        canvas { display: block; width: 100vw; height: 100vh; }
        #ui { position: absolute; top: 15px; left: 15px; color: #fff; background: rgba(10, 10, 30, 0.75); padding: 15px; border-radius: 12px; border: 1px solid #334155; backdrop-filter: blur(8px); pointer-events: none; }
        h3 { margin: 0 0 4px 0; font-size: 16px; letter-spacing: 1px; color: #38bdf8; text-transform: uppercase; }
        p { margin: 0; font-size: 12px; color: #94a3b8; line-height: 1.5; }
    </style>
</head>
<body>
    <div id="ui">
        <h3>Quantum Vortex</h3>
        <p>• Left Click & Drag: Pull & Swirl Particles<br>• Right Click / Double Tap: Trigger Explosion</p>
    </div>
    <canvas id="sandbox"></canvas>

    <script>
        const canvas = document.getElementById('sandbox');
        const ctx = canvas.getContext('2d');
        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;
        
        window.addEventListener('resize', () => { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; });

        const particles = [];
        const vortexes = [];
        let isMouseDown = false;
        let mouseX = 0, mouseY = 0;

        class Particle {
            constructor(x, y) {
                this.x = x; this.y = y;
                this.vx = (Math.random() - 0.5) * 5;
                this.vy = (Math.random() - 0.5) * 5;
                this.hue = Math.random() * 40 + 190; // Deep cyan/blue spectrum
                this.size = Math.random() * 2.5 + 1;
            }
            update() {
                vortexes.forEach(v => {
                    const dx = v.x - this.x;
                    const dy = v.y - this.y;
                    const dist = Math.sqrt(dx * dx + dy * dy) || 1;
                    if (dist < v.radius) {
                        const force = (v.radius - dist) / v.radius * 0.5;
                        // Inward orbital pull
                        this.vx += (dx / dist) * force;
                        this.vy += (dy / dist) * force;
                        // Cross-product swirl (creates the spinning vortex flow)
                        this.vx += (-dy / dist) * force * 1.8;
                        this.vy += (dx / dist) * force * 1.8;
                        // Accelerate color spectrum excitation inside fields
                        this.hue = (this.hue + 1) % 360;
                    }
                });
                this.vx *= 0.98; this.vy *= 0.98; // Hydrodynamic friction
                this.x += this.vx; this.y += this.vy;
                
                // Screen boundary bouncing
                if (this.x < 0 || this.x > width) this.vx *= -1;
                if (this.y < 0 || this.y > height) this.vy *= -1;
            }
            draw() {
                ctx.fillStyle = `hsl(${this.hue}, 100%, 65%)`;
                ctx.fillRect(this.x, this.y, this.size, this.size);
            }
        }

        // Initialize high density particle cluster
        for (let i = 0; i < 2500; i++) {
            particles.push(new Particle(Math.random() * width, Math.random() * height));
        }

        // Desktop Pointer Listeners
        window.addEventListener('mousedown', (e) => {
            isMouseDown = true; mouseX = e.clientX; mouseY = e.clientY;
            if (e.button === 2) triggerExplosion(mouseX, mouseY);
        });
        window.addEventListener('mousemove', (e) => { mouseX = e.clientX; mouseY = e.clientY; });
        window.addEventListener('mouseup', () => isMouseDown = false);
        window.addEventListener('contextmenu', e => e.preventDefault()); // Disables boring browser right click menu

        // Mobile / Touch Interaction Support
        window.addEventListener('touchstart', (e) => {
            isMouseDown = true; mouseX = e.touches[0].clientX; mouseY = e.touches[0].clientY;
        });
        window.addEventListener('touchmove', (e) => { mouseX = e.touches[0].clientX; mouseY = e.touches[0].clientY; });
        window.addEventListener('touchend', () => isMouseDown = false);

        function triggerExplosion(x, y) {
            particles.forEach(p => {
                const dx = p.x - x; const dy = p.y - y;
                const dist = Math.sqrt(dx * dx + dy * dy) || 1;
                if (dist < 220) {
                    const blast = (220 - dist) / 8;
                    p.vx += (dx / dist) * blast;
                    p.vy += (dy / dist) * blast;
                    p.hue = Math.random() * 40; // Ignites particles into superheated reds/oranges
                }
            });
        }

        function loop() {
            // Semi-transparent overlay canvas clear produces a beautiful luminescent motion blur trail
            ctx.fillStyle = 'rgba(5, 5, 16, 0.12)';
            ctx.fillRect(0, 0, width, height);

            // Manage active user vortex streams
            if (isMouseDown) {
                if (!vortexes.some(v => v.active)) {
                    vortexes.push({ x: mouseX, y: mouseY, radius: 260, active: true });
                } else {
                    const activeV = vortexes.find(v => v.active);
                    activeV.x = mouseX; activeV.y = mouseY;
                }
            } else {
                vortexes.forEach(v => v.active = false);
            }

            // Cap the field trail memory depth so the screen doesn't over-saturate
            if (vortexes.length > 5) vortexes.shift();

            // Render sub-atomic gravitational gravity wells
            vortexes.forEach(v => {
                ctx.beginPath();
                ctx.arc(v.x, v.y, v.active ? 25 : 12, 0, Math.PI * 2);
                ctx.strokeStyle = v.active ? 'rgba(56, 189, 248, 0.25)' : 'rgba(168, 85, 247, 0.08)';
                ctx.lineWidth = 2;
                ctx.stroke();
            });

            // Physics Update Cycle
            particles.forEach(p => {
                p.update();
                p.draw();
            });

            requestAnimationFrame(loop);
        }
        loop();
    </script>
</body>
</html>
