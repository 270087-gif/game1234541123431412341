<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fluid Alchemy Lab</title>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; background: #06060c; font-family: system-ui, sans-serif; color: #fff; user-select: none; }
        canvas { display: block; width: 100vw; height: 100vh; }
        #ui { position: absolute; top: 20px; left: 20px; pointer-events: none; text-shadow: 0 2px 8px rgba(0,0,0,0.9); }
        h1 { margin: 0 0 4px 0; font-size: 1.6rem; font-weight: 700; letter-spacing: 0.5px; background: linear-gradient(45deg, #ff3366, #33f3ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        p { margin: 0; font-size: 0.85rem; opacity: 0.75; line-height: 1.4; }
    </style>
</head>
<body>
    <div id="ui">
        <h1>Fluid Alchemy</h1>
        <p>• Drag / Swipe across the screen to swirl the liquid.</p>
        <p>• Smash different colors together fast to mutate their elements!</p>
    </div>
    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;
        
        const particles = [];
        const types = [
            { id: 0, color: '#ff3366' },  // Pyros (Crimson Fire)
            { id: 1, color: '#33ffaa' },  // Bio (Neon Acid)
            { id: 2, color: '#3388ff' }   // Aqua (Electric Blue)
        ];

        const mouse = { x: -1000, y: -1000, active: false, px: 0, py: 0, vx: 0, vy: 0 };

        class Particle {
            constructor(x, y, typeId) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 5;
                this.vy = (Math.random() - 0.5) * 5;
                this.radius = 5 + Math.random() * 4;
                this.type = typeId;
            }

            update() {
                // Fluid Drag/Viscosity (gives it that heavy, liquid feel)
                this.vx *= 0.97;
                this.vy *= 0.97;

                // Mouse interaction physics
                if (mouse.active) {
                    const dx = this.x - mouse.x;
                    const dy = this.y - mouse.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < 180) {
                        const force = (180 - dist) / 180;
                        // Swirl / Vortex cross-product vector calculations + direct mouse momentum transfer
                        this.vx += mouse.vx * force * 0.25 + (dy / (dist || 1)) * force * 2.5;
                        this.vy += mouse.vy * force * 0.25 - (dx / (dist || 1)) * force * 2.5;
                    }
                }

                this.x += this.vx;
                this.y += this.vy;

                // Boundary physics (bounce off borders safely)
                if (this.x < this.radius) { this.x = this.radius; this.vx *= -0.6; }
                if (this.x > width - this.radius) { this.x = width - this.radius; this.vx *= -0.6; }
                if (this.y < this.radius) { this.y = this.radius; this.vy *= -0.6; }
                if (this.y > height - this.radius) { this.y = height - this.radius; this.vy *= -0.6; }
            }
        }

        // Spawn custom interactive mix of particles
        const particleCount = Math.min(380, Math.floor((width * height) / 2500));
        for (let i = 0; i < particleCount; i++) {
            particles.push(new Particle(Math.random() * width, Math.random() * height, Math.floor(Math.random() * types.length)));
        }

        function handleInteractions() {
            for (let i = 0; i < particles.length; i++) {
                const p1 = particles[i];
                for (let j = i + 1; j < particles.length; j++) {
                    const p2 = particles[j];
                    const dx = p2.x - p1.x;
                    const dy = p2.y - p1.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    const minDist = p1.radius + p2.radius + 10; // Overlap buffer zone for fluid pressure

                    if (dist < minDist) {
                        // Hydrostatic pressure pushing particles apart
                        const force = (minDist - dist) * 0.05;
                        const ax = (dx / (dist || 1)) * force;
                        const ay = (dy / (dist || 1)) * force;

                        p1.vx -= ax;
                        p1.vy -= ay;
                        p2.vx += ax;
                        p2.vy += ay;

                        // Kinetic mutation mechanics (Smashed reactions)
                        if (p1.type !== p2.type && dist < (p1.radius + p2.radius) * 1.3) {
                            const relativeSpeed = Math.sqrt((p1.vx - p2.vx)**2 + (p1.vy - p2.vy)**2);
                            
                            if (relativeSpeed > 2.2) { // Must slam them with enough force to blend elements
                                if ((p1.type === 0 && p2.type === 1) || (p1.type === 1 && p2.type === 0)) {
                                    p1.type = 2; p2.type = 2; // Fire + Acid mutates to Blue Aqua
                                } else if ((p1.type === 1 && p2.type === 2) || (p1.type === 2 && p2.type === 1)) {
                                    p1.type = 0; p2.type = 0; // Acid + Water ignites to Red Pyros
                                } else if ((p1.type === 2 && p2.type === 0) || (p1.type === 0 && p2.type === 2)) {
                                    p1.type = 1; p2.type = 1; // Water + Fire synthesizes Neon Acid
                                }
                            }
                        }
                    }
                }
            }
        }

        function animate() {
            // Semi-transparent trailing alpha layer creates a beautiful liquid motion blur
            ctx.fillStyle = 'rgba(6, 6, 12, 0.22)';
            ctx.fillRect(0, 0, width, height);

            if (mouse.active) {
                mouse.vx = mouse.x - mouse.px;
                mouse.vy = mouse.y - mouse.py;
                mouse.px = mouse.x;
                mouse.py = mouse.y;
            }

            handleInteractions();

            particles.forEach(p => {
                p.update();
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = types[p.type].color;
                // Native canvas neon glow properties
                ctx.shadowBlur = 12;
                ctx.shadowColor = types[p.type].color;
                ctx.fill();
            });
            
            ctx.shadowBlur = 0; // Performance optimization reset
            requestAnimationFrame(animate);
        }

        // Mouse & Touch Inputs
        const updateMouse = (e) => {
            const t = e.touches ? e.touches[0] : e;
            mouse.x = t.clientX;
            mouse.y = t.clientY;
        };

        window.addEventListener('mousedown', (e) => { mouse.active = true; mouse.px = e.clientX; mouse.py = e.clientY; updateMouse(e); });
        window.addEventListener('mousemove', updateMouse);
        window.addEventListener('mouseup', () => { mouse.active = false; });
        
        window.addEventListener('touchstart', (e) => { mouse.active = true; mouse.px = e.touches[0].clientX; mouse.py = e.touches[0].clientY; updateMouse(e); }, {passive: false});
        window.addEventListener('touchmove', (e) => { updateMouse(e); e.preventDefault(); }, {passive: false});
        window.addEventListener('touchend', () => { mouse.active = false; });

        window.addEventListener('resize', () => { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; });

        animate();
    </script>
</body>
</html>
